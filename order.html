<title>Bhumija Chakki – Order Online</title>
<style>
:root{--g:#2f5d3a;--g2:#e6efe3;--gd:#244a2d;--sa:#d9822b;--bg:#fbf6ea;--t:#1f2a1c;--m:#6f7568;--c:#fff;--b:#e8e1d0;--sh:0 2px 10px rgba(47,93,58,.08)}
@media(prefers-color-scheme:dark){:root{--g:#6fbf82;--g2:#1f2e24;--gd:#4f9f64;--sa:#e89a4a;--bg:#14171a;--t:#eee;--m:#9a9a9a;--c:#1d2125;--b:#2f353b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
header{background:linear-gradient(160deg,#2f5d3a,#1f4429);color:#fff;text-align:center;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 12px;border-radius:0 0 20px 20px}
.logo{width:clamp(60px,17vw,76px);height:auto;aspect-ratio:1;border-radius:50%;background:#fff;display:block;margin:0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 3px 10px rgba(0,0,0,.3)}
header p{margin:6px 0 0;font-size:13px;letter-spacing:.3px;opacity:.95}
.trust{display:none}
.trust span{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
main{max-width:640px;margin:auto;padding:0 14px}
.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.tab{flex:1;min-height:46px;border-radius:14px;border:1.5px solid var(--b);background:var(--c);color:var(--t);font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--sh)}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.em{width:54px;height:54px;flex:none;border-radius:16px;background:var(--g2);display:grid;place-items:center;font-size:28px}
.nm{font-weight:700;font-size:17px;line-height:1.25}
.pk{display:inline-block;margin-top:4px;background:var(--g2);color:var(--g);font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 12px}
.chip{min-height:42px;border:1.5px solid var(--b);background:var(--c);color:var(--t);padding:8px 2px;border-radius:12px;font-size:14px;white-space:nowrap;text-align:center;font-weight:600;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:22px;font-weight:800;color:var(--g)}
button.add{background:var(--sa);color:#fff;border:0;border-radius:12px;min-height:46px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer}
button.add:active,.tab:active,.chip:active{transform:scale(.97)}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
#bar button{width:100%;max-width:640px;display:block;margin:auto;background:var(--g);color:#fff;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.2)}
#bar button:disabled{background:var(--b);color:var(--m);box-shadow:none}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}
#sheet.open{display:block}
#panel{position:absolute;bottom:0;left:0;right:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;-webkit-overflow-scrolling:touch}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--b);gap:8px}
.item .pk{background:none;color:var(--m);padding:0;font-weight:500;font-size:13px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--b);background:var(--c);color:var(--t);font-size:20px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1.5px solid var(--b);border-radius:12px;font:inherit;font-size:16px;background:var(--c);color:var(--t)}
input:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.tot{font-size:19px;font-weight:800;margin:12px 0}
.close{float:right;background:var(--c);border:1px solid var(--b);border-radius:50%;width:38px;height:38px;font-size:22px;color:var(--t);cursor:pointer}
.wa{background:#25d366!important;color:#fff;border:0;border-radius:14px;font-weight:700}
.note{font-size:12px;color:var(--m);text-align:center;margin:18px 0}
@media(max-width:380px){.chip{font-size:13px}.nm{font-size:16px}}
@media(min-width:700px){#panel{border-radius:22px;bottom:auto;top:50%;transform:translateY(-50%)}}
.pr{font-size:19px;font-weight:800;color:var(--g);white-space:nowrap}
.pr small{font-size:12px;font-weight:600;color:var(--m);margin-left:1px}
.inc{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.ic{display:inline-flex;align-items:center;gap:6px;background:var(--g2);color:var(--g);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:700}
.ic button{width:22px;height:22px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.card{padding:10px 12px;margin-bottom:8px;border-radius:14px}
.nm{font-size:16px}.pr{font-size:17px}
.chips{gap:5px;margin:8px 0}
.chip{min-height:36px;font-size:13px;border-radius:10px}
button.add{width:100%;min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.inc{margin:0 0 8px;gap:5px}
.ic{padding:3px 4px 3px 10px;font-size:12px}
.ic button{width:20px;height:20px}
.tabs{padding:10px 0 8px}.tab{min-height:42px}
.bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.left{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.sp{font-size:19px;font-weight:800;color:var(--g);margin-right:2px}
button.add{width:auto;flex:none;min-height:38px;padding:0 18px;font-size:14px}
header{padding:calc(9px + env(safe-area-inset-top,0px)) 16px 10px;border-radius:0 0 16px 16px}
header h1{margin:0;font-size:19px;letter-spacing:.3px}
header p{margin:1px 0 0;font-size:12px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nmw{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.nm{font-size:15px}.pr{font-size:14px}
button.add{min-height:34px;padding:0 14px;font-size:13px;white-space:nowrap}
.chips{margin:7px 0 0;gap:5px}
.chip{min-height:34px;font-size:13px}
.inc{margin:7px 0 0}
.tabs{padding:8px 0 6px}.tab{min-height:40px}
.nmw{flex-wrap:nowrap;gap:6px}
.nm{font-size:14px;line-height:1.2}.pr{font-size:13px;white-space:nowrap;flex:none}
button.add{padding:0 16px;font-size:14px;min-height:34px}
@media(max-width:340px){.nm{font-size:13px}.pr{font-size:12px}}
.chips{margin:6px 0}
.bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.left{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.sp{font-size:17px;font-weight:800;color:var(--g);margin-right:2px}
.ic{padding:2px 4px 2px 9px;font-size:12px}
button.add{min-height:34px;padding:0 20px;font-size:14px}
.close{float:none;position:absolute;top:12px;right:12px;z-index:2}
#panel h2{padding-right:48px;min-height:38px;display:flex;align-items:center}
.item>div:first-child{flex:1;min-width:0}
.step{flex:none;width:124px;justify-content:space-between}
.step b{min-width:24px;text-align:center}
.item{width:100%}
</style>
</head>
<body>
<header><h1>Bhumija Chakki</h1><p>Freshly Milled, Freshly Delivered</p></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <p class="note">Pick a pack size, add to cart, and send your order on WhatsApp. 🌾</p>
</main>

<div id="bar"><button id="viewCart" disabled>Cart is empty</button></div>

<div id="sheet"><div id="panel">
  <button class="close" id="closeSheet">×</button>
  <div id="step1">
    <h2 style="margin:0 0 8px">Review your items</h2>
    <div id="items"></div>
    <div class="tot row"><span>Total</span><span id="total"></span></div>

  </div>
  <div id="step2" style="display:none">
    <h2 style="margin:0 0 4px">Delivery details</h2>
    <div class="note" id="sum" style="margin:0 0 8px;text-align:left"></div>
    <input id="name" placeholder="Your name">
    <input id="phone" type="tel" placeholder="Phone number">
    <textarea id="addr" rows="2" placeholder="Delivery address"></textarea>
    <button class="chip" id="locBtn" type="button" style="width:100%;margin:6px 0;padding:12px">📍 Share my delivery location</button>
    <div id="locStat" class="note" style="margin-bottom:6px">Helps us find your doorstep quickly.</div>
    <textarea id="notes" rows="1" placeholder="Notes (optional)"></textarea>
    <button class="add wa" id="send" style="width:100%;padding:14px;min-height:48px;margin-top:8px;font-size:16px">Order on WhatsApp</button>
    <button class="chip" id="backBtn" style="width:100%;margin-top:8px">← Back to items</button>
  </div>
</div></div>

const SHOP_WHATSAPP = "916360683923"; // country code + number, no + or spaces
const PRODUCTS = [ // price = rupees per kg (Atta & Flour) or per 100 g (Masala)
  {id:"a0",cat:"Atta & Flour",name:"Sharbati Wheat Atta",price:65,emoji:"🌾"},
  {id:"a1",cat:"Atta & Flour",name:"Multigrain Atta",price:100,emoji:"🥣"},
  {id:"a2",cat:"Atta & Flour",name:"Khapli Atta",price:150,emoji:"🌾"},
  {id:"a3",cat:"Atta & Flour",name:"Jowar Atta",price:75,emoji:"🌾"},
  {id:"a4",cat:"Atta & Flour",name:"Ragi Atta",price:70,emoji:"🌱"},
  {id:"a5",cat:"Atta & Flour",name:"Bajra Atta",price:65,emoji:"🌾"},
  {id:"a6",cat:"Atta & Flour",name:"Besan",price:130,emoji:"🟡"},
  {id:"a7",cat:"Atta & Flour",name:"Makka Atta",price:90,emoji:"🌽"},
  {id:"a8",cat:"Atta & Flour",name:"Rice Atta",price:60,emoji:"🍚"},
  {id:"a9",cat:"Atta & Flour",name:"Sattu",price:200,emoji:"🥛"},
  {id:"m0",cat:"Masala",name:"Chilli Spicy",price:60,emoji:"🌶️"},
  {id:"m1",cat:"Masala",name:"Chilli Medium",price:60,emoji:"🌶️"},
  {id:"m2",cat:"Masala",name:"Chilli Kashmiri",price:100,emoji:"🌶️"},
  {id:"m3",cat:"Masala",name:"Dania Powder",price:50,emoji:"🌿"},
  {id:"m4",cat:"Masala",name:"Sambar Masala",price:60,emoji:"🍲"},
  {id:"m5",cat:"Masala",name:"Garam Masala",price:120,emoji:"🧂"},
  {id:"m6",cat:"Masala",name:"Turmeric / Haldi",price:50,emoji:"🟠"}
];
const CATS = ["Atta & Flour","Masala"];
const SIZES = {"Atta & Flour":[0.5,1,2,3,5], "Masala":[50,100,200,250,500]}; // kg for flour, grams for masala
/* =============================== */

const isM = p => p.cat==="Masala";
const label = (p,s) => isM(p) ? s+" g" : (s<1 ? (s*1000)+" g" : s+" kg");
const price = (p,s) => Math.round(isM(p) ? p.price*s/100 : p.price*s);
const unit = p => isM(p) ? "100 g" : "kg";
let cat = CATS[0];
let loc = null;
const sel = {}, cart = {};
PRODUCTS.forEach(p => sel[p.id] = SIZES[p.cat][isM(p)?1:1]);
const $ = id => document.getElementById(id);

function renderList(){
  $("tabs").innerHTML = CATS.map(c=>`<button class="tab ${c===cat?'on':''}" onclick="cat='${c}';renderList()">${c}</button>`).join("");
  $("list").innerHTML = PRODUCTS.filter(p=>p.cat===cat).map(p => `
    <div class="card">
      <div class="top"><div class="nmw"><span class="nm">${p.name}</span><span class="pr">₹${p.price}<small>/${isM(p)?"100 g":"kg"}</small></span></div></div>
      <div class="chips">${SIZES[p.cat].map(s=>`<button class="chip ${sel[p.id]===s?'on':''}" onclick="pick('${p.id}',${s})">${label(p,s)}</button>`).join("")}</div>
      <div class="bot"><div class="left"><span class="sp">₹${price(p,sel[p.id])}</span>${inCart(p)}</div>
        <button class="add" onclick="addToCart('${p.id}')">+ Add</button></div>
    </div>`).join("");
}
function inCart(p){
  const ks = Object.keys(cart).filter(k=>k.split("|")[0]===p.id);
  if(!ks.length) return "";
  return `${ks.map(k=>{const sz=parseFloat(k.split("|")[1]);
    return `<span class="ic">✓ ${label(p,sz)} × ${cart[k]}<button aria-label="Remove one" onclick="change('${k}',-1)">×</button></span>`}).join("")}`;
}
function pick(id,s){sel[id]=s;renderList();}
function addToCart(id){
  const k = id+"|"+sel[id];
  cart[k] = (cart[k]||0)+1;
  updateBar(); renderList();
}
function change(k,d){
  cart[k]+=d; if(cart[k]<=0) delete cart[k];
  updateBar(); renderCart(); renderList();
  if(!Object.keys(cart).length) $("sheet").classList.remove("open");
}
function lines(){
  return Object.entries(cart).map(([k,q])=>{
    const [id,s]=k.split("|"); const p=PRODUCTS.find(x=>x.id===id); const sz=parseFloat(s);
    return {k,p,sz,q,amt:price(p,sz)*q};
  });
}
const total = () => lines().reduce((a,l)=>a+l.amt,0);
function updateBar(){
  const n = Object.values(cart).reduce((a,b)=>a+b,0);
  const b = $("viewCart");
  b.disabled = !n;
  b.textContent = n ? `View cart (${n} item${n>1?'s':''}) · ₹${total()}` : "Cart is empty";
}
function renderCart(){
  $("items").innerHTML = lines().map(l=>`
    <div class="item">
      <div><b>${l.p.name}</b><br><span class="pk">${label(l.p,l.sz)} × ${l.q} = ₹${l.amt}</span></div>
      <div class="step"><button onclick="change('${l.k}',-1)">−</button><b>${l.q}</b><button onclick="change('${l.k}',1)">+</button></div>
    </div>`).join("");
  $("total").textContent = "₹"+total();
}
function showStep(n){$("step1").style.display=n===1?"block":"none";$("step2").style.display=n===2?"block":"none";$("panel").scrollTop=0;}
$("viewCart").onclick = () => {renderCart(); showStep(1); $("sheet").classList.add("open");};
$("toDetails").onclick = () => {
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  $("sum").textContent = n+" item"+(n>1?"s":"")+" · Total ₹"+total();
  showStep(2);
};
$("backBtn").onclick = () => {renderCart(); showStep(1);};
$("closeSheet").onclick = () => $("sheet").classList.remove("open");
$("locBtn").onclick = () => {
  const st = $("locStat");
  if(!navigator.geolocation){st.textContent="Location not supported on this device.";return;}
  st.textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(pos=>{
    loc = {lat:pos.coords.latitude.toFixed(6), lng:pos.coords.longitude.toFixed(6)};
    st.textContent="✅ Location captured";
    $("locBtn").classList.add("on");
  }, ()=>{
    st.textContent="Could not get location. Please allow location access, or type a clear address with a landmark.";
  }, {enableHighAccuracy:true, timeout:15000});
};
$("send").onclick = () => {
  const name=$("name").value.trim(), phone=$("phone").value.trim(), addr=$("addr").value.trim();
  if(!name||!phone||!addr){alert("Please enter your name, phone and address.");return;}
  if(!loc && !confirm("You haven't shared your location. Send the order without it?")) return;
  let m = "*New Order – Bhumija Chakki*\n\n";
  lines().forEach(l => m += `• ${l.p.name} ${label(l.p,l.sz)} × ${l.q} = ₹${l.amt}\n`);
  m += `\n*Total: ₹${total()}*\n\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
  if(loc) m += `\nLocation: https://maps.google.com/?q=${loc.lat},${loc.lng}`;
  const notes=$("notes").value.trim(); if(notes) m += `\nNotes: ${notes}`;
  window.open("https://wa.me/"+SHOP_WHATSAPP+"?text="+encodeURIComponent(m),"_blank");
};
renderList();
</script>
</body>
</html>
